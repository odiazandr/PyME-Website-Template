schema_version = 1
mode = "template"

[checks]
build = ["npm", "run", "build"]
test = ["npm", "test"]
lint = ["npm", "run", "quality:static"]
secret_scan = []

[placeholders]
allow = []

[working_set]
enabled = true
directory = ".memory/working-sets"
maximum_pointers = 20
maximum_reason_length = 160
